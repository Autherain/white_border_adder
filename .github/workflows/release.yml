name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: >
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
          go build -ldflags "-s -w -X github.com/evaneecloo/white_border_adder/internal/cli.version=${{ github.ref_name }}"
          -o wba-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/wba
      - uses: actions/upload-artifact@v4
        with:
          name: wba-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wba-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" wba-* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
