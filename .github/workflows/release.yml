name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "", name: wba-linux-amd64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe, name: wba-windows-amd64.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "", name: wba-darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          WBA_VERSION: ${{ github.ref_name }}
      - run: cp target/${{ matrix.target }}/release/wba${{ matrix.ext }} ${{ matrix.name }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" wba-* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
