[package]
name = "wba"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/evaneecloo/white_border_adder"
description = "White borders for Instagram and cleanup of undeveloped raws"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
glob = "0.3"
fast_image_resize = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jpeg-decoder = { version = "0.3", default-features = false }
jiff = "0.2"
owo-colors = "4"
thiserror = "2"
vfs = "0.13"

[dev-dependencies]
mockall = "0.15"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
# Product names (RawTherapee) are not code.
doc_markdown = "allow"
# Table-driven tests are long by design.
too_many_lines = "allow"
# `name = x.to_owned()` reads better than `x.clone_into(&mut name)`.
assigning_clones = "allow"

[profile.release]
strip = true
lto = "thin"
